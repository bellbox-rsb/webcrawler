steps:
  # 1. Build Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/webcrawler-backend', '-f', 'backend/Dockerfile', '.']

  # 2. Build Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/webcrawler-frontend', '-f', 'frontend/Dockerfile', '.']

  # 3. Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'webcrawler-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/webcrawler-backend'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

  # 4. Deploy Frontend to Cloud Run
  # We use bash to fetch the backend URL and pass it to the frontend deployment.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        BACKEND_URL=$(gcloud run services describe webcrawler-backend --region us-central1 --format 'value(status.url)')
        gcloud run deploy webcrawler-frontend \
          --image gcr.io/$PROJECT_ID/webcrawler-frontend \
          --region us-central1 \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars BACKEND_URL=$$BACKEND_URL

images:
  - 'gcr.io/$PROJECT_ID/webcrawler-backend'
  - 'gcr.io/$PROJECT_ID/webcrawler-frontend'

options:
  logging: CLOUD_LOGGING_ONLY
