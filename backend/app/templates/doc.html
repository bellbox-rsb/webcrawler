<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation - WebCrawler v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Reuse main styles (scrollbar, noise) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Typography overrides for Markdown content (Manual conversion of Tailwind classes) */
        .prose h1 {
            font-size: 1.875rem;
            /* text-3xl */
            line-height: 2.25rem;
            font-weight: 700;
            /* font-bold */
            color: white;
            margin-bottom: 1.5rem;
            /* mb-6 */
            margin-top: 2rem;
            /* mt-8 */
        }

        .prose h2 {
            font-size: 1.5rem;
            /* text-2xl */
            line-height: 2rem;
            font-weight: 600;
            /* font-semibold */
            color: white;
            margin-bottom: 1rem;
            /* mb-4 */
            margin-top: 2rem;
            /* mt-8 */
            padding-bottom: 0.5rem;
            /* pb-2 */
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .prose h3 {
            font-size: 1.25rem;
            /* text-xl */
            line-height: 1.75rem;
            font-weight: 500;
            /* font-medium */
            color: #34d399;
            /* text-emerald-400 */
            margin-bottom: 0.75rem;
            /* mb-3 */
            margin-top: 1.5rem;
            /* mt-6 */
        }

        .prose p {
            color: #a3a3a3;
            /* text-neutral-400 */
            line-height: 1.625;
            /* leading-relaxed */
            margin-bottom: 1rem;
            /* mb-4 */
        }

        .prose ul {
            list-style-type: disc;
            list-style-position: outside;
            margin-left: 1.5rem;
            /* ml-6 */
            margin-bottom: 1rem;
            /* mb-4 */
            color: #a3a3a3;
            /* text-neutral-400 */
        }

        .prose ol {
            list-style-type: decimal;
            list-style-position: outside;
            margin-left: 1.5rem;
            /* ml-6 */
            margin-bottom: 1rem;
            /* mb-4 */
            color: #a3a3a3;
            /* text-neutral-400 */
        }

        .prose code {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 0.125rem 0.375rem;
            border-radius: 0.25rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.875rem;
            /* text-sm */
            color: #6ee7b7;
            /* text-emerald-300 */
        }

        .prose pre {
            background-color: rgba(23, 23, 23, 0.5);
            /* bg-neutral-900/50 */
            padding: 1rem;
            border-radius: 0.75rem;
            /* rounded-xl */
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow-x: auto;
            margin-bottom: 1.5rem;
        }

        .prose pre code {
            background-color: transparent;
            padding: 0;
            color: #d4d4d4;
            /* text-neutral-300 */
        }

        .prose a {
            color: #34d399;
            /* text-emerald-400 */
            text-decoration: underline;
            text-decoration-color: rgba(255, 255, 255, 0.1);
            text-underline-offset: 4px;
            transition: color 0.15s;
        }

        .prose a:hover {
            color: #6ee7b7;
            /* text-emerald-300 */
        }

        .prose blockquote {
            border-left: 4px solid rgba(16, 185, 129, 0.5);
            /* border-emerald-500/50 */
            padding-left: 1rem;
            padding-top: 0.25rem;
            padding-bottom: 0.25rem;
            margin-top: 1rem;
            margin-bottom: 1rem;
            background-color: rgba(255, 255, 255, 0.05);
            border-top-right-radius: 0.5rem;
            border-bottom-right-radius: 0.5rem;
            font-style: italic;
            color: #a3a3a3;
            /* text-neutral-400 */
        }

        .prose img {
            max-width: 100%;
            height: auto;
            border-radius: 0.5rem;
            /* rounded-lg */
            margin-top: 1.5rem;
            margin-bottom: 1.5rem;
            display: inline-block;
            /* Allow badges to flow */
        }

        .prose div[align="center"] img {
            margin: 0.25rem;
        }

        /* Force Flexbox for centered paragraphs (Badges) */
        .prose div[align="center"] p {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
    </style>
</head>

<body
    class="text-neutral-400 antialiased selection:bg-emerald-500/20 selection:text-white min-h-screen flex flex-col relative overflow-x-hidden bg-[#030303]">

    <!-- Background Gradients -->
    <div
        class="fixed top-0 left-1/2 -translate-x-1/2 w-[1000px] h-[500px] bg-white/[0.02] blur-[120px] rounded-full pointer-events-none z-0">
    </div>
    <div class="noise-bg"></div>

    <!-- Header -->
    <header
        class="w-full max-w-7xl mx-auto px-6 py-6 flex justify-between items-center relative z-10 sticky top-0 bg-[#030303]/80 backdrop-blur-xl border-b border-white/5">
        <a href="/" class="flex items-center gap-2 group cursor-pointer">
            <span class="iconify text-white group-hover:text-emerald-400 transition-colors" data-icon="lucide:layers"
                data-width="20"></span>
            <span class="text-white font-medium tracking-tighter text-sm uppercase">WebCrawler <span
                    class="text-neutral-600 ml-1">v2.0</span></span>
        </a>

        <nav class="flex gap-6 items-center">
            <a href="/" class="text-xs font-medium text-neutral-500 hover:text-white transition-colors">Home</a>
            <a href="https://github.com/yourusername/markdown-crawler" target="_blank"
                class="p-2 bg-white/5 hover:bg-white/10 rounded-full transition-colors text-white">
                <span class="iconify" data-icon="lucide:github" data-width="16"></span>
            </a>
        </nav>
    </header>

    <!-- Tabs -->
    <div class="w-full max-w-4xl mx-auto px-6 mt-8 relative z-10 border-b border-white/10">
        <nav class="flex gap-6" aria-label="Tabs">
            <a href="/docs"
                class="tab-link px-1 py-4 text-sm font-medium text-neutral-400 hover:text-white border-b-2 border-transparent hover:border-neutral-400 transition-colors"
                data-path="/docs">
                Overview
            </a>
            <a href="/docs/docs/tech.md"
                class="tab-link px-1 py-4 text-sm font-medium text-neutral-400 hover:text-white border-b-2 border-transparent hover:border-neutral-400 transition-colors"
                data-path="/docs/docs/tech.md">
                Tech Stack
            </a>
            <a href="/docs/docs/changelog.md"
                class="tab-link px-1 py-4 text-sm font-medium text-neutral-400 hover:text-white border-b-2 border-transparent hover:border-neutral-400 transition-colors"
                data-path="/docs/docs/changelog.md">
                Changelog
            </a>
        </nav>
    </div>

    <!-- Main Content -->
    <main class="flex-grow w-full max-w-4xl mx-auto px-6 py-8 relative z-10 fade-in">
        <div class="prose max-w-none">
            {{ content | safe }}
        </div>
    </main>

    <script>
        // Highlight active tab
        document.addEventListener('DOMContentLoaded', () => {
            const currentPath = window.location.pathname;
            const tabs = document.querySelectorAll('.tab-link');

            // Default to Overview if path is exactly /docs or /docs/
            let activeFound = false;

            tabs.forEach(tab => {
                const tabPath = tab.getAttribute('data-path');
                // Check if current path matches tab path exactly
                if (currentPath === tabPath) {
                    tab.classList.add('text-emerald-400', 'border-emerald-500');
                    tab.classList.remove('text-neutral-400', 'border-transparent', 'hover:border-neutral-400');
                    activeFound = true;
                }
            });

            // If no exact match (e.g. clean URL issues), and we are at /docs root, highlight first
            if (!activeFound && (currentPath === '/docs' || currentPath === '/docs/')) {
                const first = tabs[0];
                first.classList.add('text-emerald-400', 'border-emerald-500');
                first.classList.remove('text-neutral-400', 'border-transparent', 'hover:border-neutral-400');
            }
        });
    </script>

    <!-- Footer -->
    <footer class="w-full border-t border-white/5 bg-[#0a0a0a] relative z-10 mt-auto">
        <div class="max-w-7xl mx-auto px-6 py-8 flex justify-between items-center">
            <div class="flex items-center gap-2 opacity-50">
                <span class="text-xs text-neutral-500">© 2024 WebCrawler</span>
            </div>
            <a href="#" class="text-xs text-neutral-600 hover:text-neutral-400">Top &uarr;</a>
        </div>
    </footer>

</body>

</html>
